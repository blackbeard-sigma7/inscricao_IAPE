<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="ea_nlx_icon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salas dos Alunos</title>
  <style>
    /* --------- Reset básico --------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }

    /* --------- Ampliação 150% --------- */
    .zoom-wrap {
      /* Chrome / Edge / Safari */
      zoom: 1.20;

      /* Fallback Firefox */
      transform: scale(1.5);
      transform-origin: top left;

      /* Corrige a largura/altura efetiva quando usamos transform */
      width: calc(100% / 1.5);
      height: calc(100% / 1.5);
    }

    /* Em telas pequenas, não ampliar (evita estouro no mobile) */
    @media (max-width: 768px) {
      .zoom-wrap {
        zoom: 1;
        transform: none;
        width: 100%;
        height: auto;
      }
      body { overflow-y: auto; }
    }

    /* --------- Layout --------- */
    .main-container { display: flex; width: 100%; height: 100%; }
    .container {
      width: 80%;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
      align-content: start;
      overflow: auto;
    }
    h1 {
      color: #9b59b6;
      font-size: 2.2em;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      grid-column: 1 / -1;
      margin-bottom: 18px;
    }

    .classe {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #000;
    }
    .classe-nome {
      font-size: 1.4em;
      font-weight: bold;
      color: #030303;
    }
    .obs {
      font-size: .95em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: .5px;
      opacity: .85;
    }
    .info { display: flex; flex-direction: column; gap: 6px; font-size: 1.1em; color: #070606; }
    .info strong { color: #9b59b6; }

    /* Cores das duas classes */
    .classe.bangladesh { background-color: #FBB6CE; }
    .classe.iraque     { background-color: #B5EAD7; }

    /* Coluna do QR */
    .qr-code {
      width: 20%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #333;
      padding: 30px;
    }
    .qr-code h2 { color: #fff; font-size: 1.4em; margin-bottom: 16px; text-align: center; }
    .qr-code img {
      width: 280px; height: 280px;
      border: 3px solid #9b59b6; border-radius: 10px;
      object-fit: cover;
    }

    /* Ajustes para laptops comuns */
    @media (max-width: 1366px) {
      .container { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); padding: 15px; }
      .classe { padding: 18px; }
      .qr-code img { width: 240px; height: 240px; }
    }

    /* Mobile: empilhar e esconder QR */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .container { width: 100%; padding: 12px; grid-template-columns: 1fr; gap: 12px; }
      .qr-code { display: none; }
    }
  </style>
</head>
<body>
  <div class="zoom-wrap">
    <div class="main-container">
      <div class="container">
        <h1>Salas dos Alunos</h1>

        <!-- Bangladesh - Adolescentes (1º Ano A) -->
        <div class="classe bangladesh">
          <div class="classe-nome">Bangladesh - Adolescentes</div>
          <div class="obs">JOVENS E ADOLESCENTES</div>
          <div class="info">
            <span><strong>Sala:</strong> 1º Ano A</span>
            <span><strong>Professores:</strong> Agno / Samuel</span>
          </div>
        </div>

        <!-- Iraque - Senior -->
        <div class="classe iraque">
          <div class="classe-nome">Iraque - Senior</div>
          <div class="obs">ADULTOS JUNTOS</div>
          <div class="info">
            <span><strong>Sala:</strong> Auditório Central</span>
            <span><strong>Professores:</strong> Wilberto / Nice</span>
          </div>
        </div>
      </div>

      <div class="qr-code">
        <h2>Veja esse mapa no seu smartphone</h2>
        <img src="qr-code-placeholder.png" alt="QR Code" />
      </div>
    </div>
  </div>
</body>
</html>
