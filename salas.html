<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="ea_nlx_icon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala do 3º Ano — Jovens & Adolescentes</title>
  <style>
    :root{
      --bg: #0e1116;          /* fundo escuro para projetor */
      --card: #eaf7f1;        /* cartão claro para contraste forte */
      --ink: #0c1220;         /* texto principal */
      --accent: #7c3aed;      /* roxo de destaque */
      --accent-ink: #ffffff;
      --radius: 20px;
    }
    *{ box-sizing: border-box; margin:0; padding:0; }
    html, body { height: 100%; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;              /* sem barras no desktop */
    }

    /* Área principal centrada */
    .stage{
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;              /* pequena margem de respiro */
    }

    /* Card gigante: ocupa quase toda a tela */
    .classe{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      width: min(96vw, 1800px);
      min-height: min(90vh, 1000px);
      padding: clamp(20px, 3vw, 48px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(16px, 2.2vw, 28px);
    }

    /* Faixa de “Jovens & Adolescentes — juntos” */
    .tag{
      display: inline-block;
      align-self: start;
      font-weight: 700;
      background: var(--accent);
      color: var(--accent-ink);
      padding: clamp(8px, 1.2vw, 14px) clamp(14px, 1.6vw, 20px);
      border-radius: 999px;
      font-size: clamp(14px, 1.6vw, 20px);
      letter-spacing: .3px;
    }

    .classe-nome{
      font-weight: 800;
      line-height: 1.1;
      font-size: clamp(28px, 5vw, 72px); /* bem grande no projetor */
      letter-spacing: .4px;
      margin-top: clamp(6px, .6vw, 10px);
    }

    .info{
      display: grid;
      align-content: start;
      gap: clamp(14px, 1.8vw, 22px);
      margin-top: clamp(10px, 1.2vw, 16px);
      font-size: clamp(18px, 3.2vw, 40px); /* linhas grandes e legíveis */
      line-height: 1.25;
    }
    .info strong{
      color: var(--accent);
      font-weight: 800;
    }

    /* Rodapé opcional (pode remover se quiser ainda mais área útil) */
    .foot{
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: clamp(12px, 1.4vw, 18px);
      opacity: .8;
    }

    /* Em telas pequenas, permitir rolagem para não cortar nada */
    @media (max-width: 768px){
      body{ overflow: auto; }
      .classe{ min-height: auto; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="classe" aria-label="Sala do 3º Ano">
      <span class="tag">Jovens & Adolescentes — juntos</span>

      <h1 class="classe-nome">Egito — Sala do 3º Ano</h1>

      <div class="info">
        <div><strong>Sala:</strong> 3º Ano</div>
        <div><strong>Professores:</strong> Agno e Soraia</div>
      </div>

      <div class="foot">
        <span>Exibição otimizada para projetor/datashow</span>
        <span>Use Ctrl + / − para ajustar o zoom, se necessário</span>
      </div>
    </section>
  </main>
</body>
</html>
