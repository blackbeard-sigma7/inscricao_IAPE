<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="ea_nlx_icon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala do 3º Ano — Jovens e Adolescentes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .main-container { display: flex; width: 100%; height: 100%; }

        /* Coluna principal (cartão da sala) */
        .container {
            width: 80%;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            align-content: start;
            overflow: auto;
        }

        h1 {
            color: #9b59b6;
            font-size: 2.2em;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            grid-column: 1 / -1;
            margin-bottom: 16px;
        }

        /* Cartão único da sala */
        .classe {
            background-color: #B5EAD7;   /* tom claro para destaque */
            color: #000;                 /* texto escuro para contraste */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .classe-nome {
            font-size: 1.4em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1.1em;
        }
        .info strong { font-weight: 700; color: #9b59b6; }

        /* Coluna lateral (QR) */
        .qr-code {
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #333;
            padding: 30px;
        }
        .qr-code h2 {
            color: #ffffff;
            font-size: 1.4em;
            margin-bottom: 18px;
            text-align: center;
        }
        .qr-code img {
            width: 260px;
            height: 260px;
            border: 3px solid #9b59b6;
            border-radius: 10px;
            object-fit: cover;
        }

        /* Responsividade: laptops */
        @media (max-width: 1366px) {
            .container { padding: 15px; }
            h1 { font-size: 2em; margin-bottom: 14px; }
            .classe { padding: 18px; }
            .classe-nome { font-size: 1.3em; }
            .info { font-size: 1.05em; }
            .qr-code img { width: 240px; height: 240px; }
            .qr-code h2 { font-size: 1.2em; }
        }

        /* Responsividade: telas maiores que tablets */
        @media (min-width: 769px) {
            .container {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            }
        }

        /* Responsividade: smartphones */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; }
            .main-container { flex-direction: column; }
            .container {
                width: 100%;
                padding: 12px;
                grid-template-columns: 1fr;
                gap: 12px;
            }
            h1 { font-size: 1.6em; margin-bottom: 12px; }
            .classe { padding: 16px; }
            .classe-nome { font-size: 1.2em; }
            .info { font-size: 1em; }
            .qr-code { display: none; } /* oculta QR no mobile */
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="container">
            <h1>Sala do 3º Ano — Jovens e Adolescentes (juntos)</h1>

            <div class="classe">
                <div class="classe-nome">Egito — Jovens e Adolescentes (juntos)</div>
                <div class="info">
                    <span><strong>Sala:</strong> 3º Ano</span>
                    <span><strong>Professores:</strong> Agno / Soraia</span>
                </div>
            </div>
        </div>

        <div class="qr-code">
            <h2>Veja este mapa no seu smartphone</h2>
            <img src="qr-code-placeholder.png" alt="QR Code para abrir o mapa no celular">
        </div>
    </div>
</body>
</html>
